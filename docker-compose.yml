services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: rootso-oracle
    ports:
      - "1521:1521"
    env_file:
      - .env
    environment:
      APP_USER: rootso
      APP_USER_PASSWORD: ${APP_USER_PASSWORD}
    volumes:
      - rootso-oracle-data:/opt/oracle/oradata

volumes:
  rootso-oracle-data:
